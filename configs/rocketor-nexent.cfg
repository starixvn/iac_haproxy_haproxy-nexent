

backend nexent_ne_flap_crash_game_socket_server_LOCAL_1_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template ne_flap_crash_game_socket_server_LOCAL_1_ 1 ne_flap_crash_game_socket_server_LOCAL_1:5000 check resolvers docker init-addr none

