backend nexent_ne_s1_reward_member_service_1_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    http-request set-path %[path,regsub(^/rewards[/]?,/,i)]
    server-template ne_s1_reward_member_service_1_ 1 ne_s1_reward_member_service_1:5000 check resolvers docker init-addr none

