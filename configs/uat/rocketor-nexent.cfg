

backend nexent_ne_s1_admin_site_service_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    server-template ne_s1_admin_site_service_UAT_ 2 ne_s1_admin_site_service_UAT:5000 check resolvers docker init-addr none

