

backend nexent_ne_flap_and_crash_game_LOCAL_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template ne_flap_and_crash_game_LOCAL_ 1 ne_flap_and_crash_game_LOCAL:5000 check resolvers docker init-addr none

